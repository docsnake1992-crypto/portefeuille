<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon portefeuille d'actions</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--txt:#1b1f27;--mut:#6b7280;--line:#e5e7eb;--acc:#1f6feb;--pos:#15803d;--neg:#b91c1c;--bar:#1f6feb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--txt:#e6e8ec;--mut:#9aa1ad;--line:#2a2f3a;--acc:#4c8dff;--pos:#4ade80;--neg:#f87171;--bar:#4c8dff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0}
main{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{color:var(--mut);display:block}
.kpi b{font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;overflow-x:auto}
.card h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:13px}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
input,select,button.btn{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--txt)}
td input{width:90px;text-align:right}
button.btn{cursor:pointer;background:var(--acc);border-color:var(--acc);color:#fff}
button.btn.sec{background:var(--card);color:var(--txt);border-color:var(--line)}
button.lnk{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:0 4px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
form label input,form label select{color:var(--txt)}
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:20px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .v{font-size:11px;color:var(--mut);margin-bottom:3px;white-space:nowrap}
.col .b{width:100%;background:var(--bar);border-radius:5px 5px 0 0;min-height:2px}
.col .m{font-size:12px;color:var(--mut);margin-top:4px}
.empty{color:var(--mut);padding:18px;text-align:center}
.hide{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header>
  <h1>📈 Mon portefeuille d'actions</h1>
  <div class="row">
    <label class="mut">Année <select id="year"></select></label>
    <button class="btn sec" onclick="exportJSON()">Sauvegarder (JSON)</button>
    <button class="btn sec" onclick="document.getElementById('imp').click()">Restaurer</button>
    <input type="file" id="imp" accept=".json" class="hide" onchange="importJSON(this)">
  </div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>

<script>
const KEY = 'portefeuille_actions_v1';
const eur = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR'});
const num = new Intl.NumberFormat('fr-FR', {maximumFractionDigits:4});
const pct = v => (isFinite(v) ? v.toLocaleString('fr-FR', {maximumFractionDigits:2}) : '0') + ' %';
const MONTHS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let S = load();
let tab = 'portefeuille';
let year = String(new Date().getFullYear());
let editId = null;

function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.tx)) return {tx:s.tx, prices:s.prices||{}}; } catch(e){}
  return {tx:[], prices:{}};
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- Calculs ---------- */
function positions(){
  const m = {};
  [...S.tx].sort((a,b) => a.date.localeCompare(b.date)).forEach(t => {
    const p = m[t.company] || (m[t.company] = {company:t.company, ticker:'', qty:0, cost:0, realized:0, div:{}});
    if (t.ticker) p.ticker = t.ticker;
    if (t.type === 'achat'){
      p.qty += t.qty; p.cost += t.qty*t.price + (t.fees||0);
    } else if (t.type === 'vente'){
      const avg = p.qty ? p.cost/p.qty : 0, q = Math.min(t.qty, p.qty);
      p.cost -= avg*q; p.qty -= q;
      p.realized += q*t.price - (t.fees||0) - avg*q;
    } else {
      const y = t.date.slice(0,4);
      const d = p.div[y] || (p.div[y] = {gross:0, tax:0});
      d.gross += t.gross; d.tax += (t.tax||0);
    }
  });
  return Object.values(m).sort((a,b) => a.company.localeCompare(b.company, 'fr'));
}
function years(){
  const ys = new Set([String(new Date().getFullYear())]);
  S.tx.forEach(t => ys.add(t.date.slice(0,4)));
  return [...ys].sort().reverse();
}
const cls = v => v >= 0 ? 'pos' : 'neg';
const sgn = v => (v > 0 ? '+' : '') + eur.format(v);

/* ---------- Rendu ---------- */
function render(){
  const ys = years();
  if (!ys.includes(year)) year = ys[0];
  document.getElementById('year').innerHTML = ys.map(y => `<option ${y===year?'selected':''}>${y}</option>`).join('');
  document.getElementById('tabs').innerHTML = [['portefeuille','Portefeuille'],['dividendes','Dividendes'],['operations','Opérations']]
    .map(([k,l]) => `<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  document.getElementById('view').innerHTML = tab==='portefeuille' ? vPortfolio() : tab==='dividendes' ? vDividends() : vOps();
  if (tab==='operations') initForm();
}
function setTab(t){ tab = t; render(); }
document.getElementById('year').onchange = e => { year = e.target.value; render(); };

function vPortfolio(){
  const P = positions().filter(p => p.qty > 0);
  let val=0, cost=0, divNet=0;
  P.forEach(p => { const px = S.prices[p.company]; p._val = px ? p.qty*px : null; val += p._val ?? p.cost; cost += p.cost; });
  positions().forEach(p => { const d = p.div[year]; if (d) divNet += d.gross - d.tax; });
  const lat = val - cost;
  const kpis = `<div class="kpis">
    <div class="kpi"><small>Valeur du portefeuille</small><b>${eur.format(val)}</b></div>
    <div class="kpi"><small>Coût d'acquisition</small><b>${eur.format(cost)}</b></div>
    <div class="kpi"><small>Plus/moins-value latente</small><b class="${cls(lat)}">${sgn(lat)}</b></div>
    <div class="kpi"><small>Dividendes nets ${year}</small><b>${eur.format(divNet)}</b></div>
    <div class="kpi"><small>Rendement sur coût ${year}</small><b>${pct(cost ? divNet/cost*100 : 0)}</b></div></div>`;
  if (!P.length) return kpis + `<div class="card empty">Aucune position. Ajoutez un achat dans l'onglet « Opérations ».</div>`;
  const rows = P.map(p => {
    const px = S.prices[p.company], pru = p.cost/p.qty, d = p.div[year];
    const pl = p._val != null ? p._val - p.cost : null;
    const w = val ? (p._val ?? p.cost)/val*100 : 0;
    return `<tr><td><b>${esc(p.company)}</b> <span class="mut">${esc(p.ticker)}</span></td>
      <td><b>${num.format(p.qty)}</b></td><td>${eur.format(pru)}</td>
      <td><input type="number" step="any" min="0" value="${px ?? ''}" placeholder="cours" onchange="setPrice('${esc(p.company).replace(/'/g,"\\'")}', this.value)"></td>
      <td>${p._val != null ? eur.format(p._val) : '<span class="mut">—</span>'}</td>
      <td class="${pl!=null?cls(pl):''}">${pl != null ? sgn(pl) : '—'}</td>
      <td>${pct(w)}</td><td>${d ? eur.format(d.gross - d.tax) : '<span class="mut">—</span>'}</td></tr>`;
  }).join('');
  const totQty = P.reduce((a,p) => a+p.qty, 0);
  return kpis + `<div class="card"><h2>Positions par société</h2><table>
    <thead><tr><th>Société</th><th>Nb actions</th><th>PRU</th><th>Cours actuel</th><th>Valeur</th><th>+/- latent</th><th>Poids</th><th>Div. nets ${year}</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Total (${P.length} sociétés)</td><td>${num.format(totQty)}</td><td></td><td></td><td>${eur.format(val)}</td><td class="${cls(lat)}">${sgn(lat)}</td><td>100 %</td><td>${eur.format(divNet)}</td></tr></tfoot></table>
    <p class="mut" style="margin:10px 0 0">PRU = prix de revient unitaire (méthode du prix moyen pondéré, frais inclus). Saisissez le cours actuel pour valoriser la ligne.</p></div>`;
}
function setPrice(c, v){ const n = parseFloat(v); if (n > 0) S.prices[c] = n; else delete S.prices[c]; save(); render(); }

function vDividends(){
  const divs = S.tx.filter(t => t.type==='dividende' && t.date.startsWith(year));
  if (!divs.length) return `<div class="card empty">Aucun dividende encaissé en ${year}. Ajoutez-en dans l'onglet « Opérations ».</div>`;
  const months = Array(12).fill(0);
  let g=0, tx=0;
  divs.forEach(t => { months[+t.date.slice(5,7)-1] += t.gross - (t.tax||0); g += t.gross; tx += (t.tax||0); });
  const max = Math.max(...months, 1);
  const chart = months.map((v,i) => `<div class="col"><div class="v">${v ? Math.round(v) : ''}</div><div class="b" style="height:${v/max*100}%" title="${MONTHS[i]} : ${eur.format(v)}"></div><div class="m">${MONTHS[i]}</div></div>`).join('');
  const by = {};
  divs.forEach(t => { const o = by[t.company] || (by[t.company] = {g:0,t:0,n:0}); o.g += t.gross; o.t += (t.tax||0); o.n++; });
  const posMap = Object.fromEntries(positions().map(p => [p.company, p]));
  const rows = Object.keys(by).sort((a,b) => a.localeCompare(b,'fr')).map(c => {
    const o = by[c], p = posMap[c];
    return `<tr><td><b>${esc(c)}</b></td><td>${o.n}</td><td>${eur.format(o.g)}</td><td>${eur.format(o.t)}</td><td><b>${eur.format(o.g-o.t)}</b></td><td>${p && p.qty ? num.format(p.qty) : '<span class="mut">soldée</span>'}</td></tr>`;
  }).join('');
  const kp = `<div class="kpis">
    <div class="kpi"><small>Dividendes bruts ${year}</small><b>${eur.format(g)}</b></div>
    <div class="kpi"><small>Impôts / retenues</small><b>${eur.format(tx)}</b></div>
    <div class="kpi"><small>Dividendes nets ${year}</small><b class="pos">${eur.format(g-tx)}</b></div>
    <div class="kpi"><small>Moyenne mensuelle nette</small><b>${eur.format((g-tx)/12)}</b></div></div>`;
  return kp + `<div class="card"><h2>Dividendes nets par mois — ${year}</h2><div class="chart">${chart}</div></div>
    <div class="card"><h2>Par société — ${year}</h2><table><thead><tr><th>Société</th><th>Versements</th><th>Brut</th><th>Impôt retenu</th><th>Net</th><th>Actions détenues</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td>Total</td><td>${divs.length}</td><td>${eur.format(g)}</td><td>${eur.format(tx)}</td><td>${eur.format(g-tx)}</td><td></td></tr></tfoot></table></div>`;
}

function vOps(){
  const names = [...new Set(S.tx.map(t => t.company))].sort((a,b) => a.localeCompare(b,'fr'));
  const list = [...S.tx].sort((a,b) => b.date.localeCompare(a.date));
  const rows = list.map(t => {
    const lbl = {achat:'Achat', vente:'Vente', dividende:'Dividende'}[t.type];
    const detail = t.type==='dividende' ? `Brut ${eur.format(t.gross)} · impôt ${eur.format(t.tax||0)}` : `${num.format(t.qty)} × ${eur.format(t.price)}${t.fees ? ' · frais ' + eur.format(t.fees) : ''}`;
    const amt = t.type==='dividende' ? t.gross-(t.tax||0) : t.qty*t.price;
    return `<tr><td>${t.date.split('-').reverse().join('/')}</td><td style="text-align:left">${lbl}</td><td style="text-align:left"><b>${esc(t.company)}</b></td><td style="text-align:left" class="mut">${detail}</td><td>${eur.format(amt)}</td>
      <td><button class="lnk" onclick="editTx('${t.id}')">Modifier</button><button class="lnk" onclick="delTx('${t.id}')">Suppr.</button></td></tr>`;
  }).join('');
  return `<div class="card"><h2 id="ftitle">Nouvelle opération</h2>
    <form id="f" onsubmit="return submitTx(event)">
      <label>Type<select id="f-type" onchange="toggleFields()"><option value="achat">Achat</option><option value="vente">Vente</option><option value="dividende">Dividende</option></select></label>
      <label>Date<input type="date" id="f-date" required></label>
      <label>Société<input id="f-company" list="names" required placeholder="ex. TotalEnergies"></label>
      <datalist id="names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <label>Ticker (option.)<input id="f-ticker" placeholder="ex. TTE"></label>
      <label class="tr">Quantité<input type="number" id="f-qty" step="any" min="0"></label>
      <label class="tr">Prix unitaire (€)<input type="number" id="f-price" step="any" min="0"></label>
      <label class="tr">Frais (€)<input type="number" id="f-fees" step="any" min="0" value="0"></label>
      <label class="dv hide">Dividende brut (€)<input type="number" id="f-gross" step="any" min="0"></label>
      <label class="dv hide">Impôt / retenue (€)<input type="number" id="f-tax" step="any" min="0" value="0"></label>
      <div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn sec" type="button" onclick="cancelEdit()">Annuler</button></div>
    </form></div>
    <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Historique (${S.tx.length})</h2><button class="btn sec" onclick="exportCSV()">Export CSV</button></div>
    ${S.tx.length ? `<table><tbody>${rows}</tbody></table>` : '<div class="empty">Aucune opération pour le moment.</div>'}</div>`;
}
function initForm(){ document.getElementById('f-date').value = new Date().toISOString().slice(0,10); toggleFields(); }
function toggleFields(){
  const dv = document.getElementById('f-type').value === 'dividende';
  document.querySelectorAll('.dv').forEach(e => e.classList.toggle('hide', !dv));
  document.querySelectorAll('.tr').forEach(e => e.classList.toggle('hide', dv));
}
function val(id){ return parseFloat(document.getElementById(id).value) || 0; }
function submitTx(e){
  e.preventDefault();
  const type = document.getElementById('f-type').value;
  const t = {id: editId || uid(), type, date: document.getElementById('f-date').value,
    company: document.getElementById('f-company').value.trim(), ticker: document.getElementById('f-ticker').value.trim().toUpperCase()};
  if (!t.company || !t.date) return false;
  if (type === 'dividende'){ t.gross = val('f-gross'); t.tax = val('f-tax'); if (t.gross <= 0) return alert('Indiquez le dividende brut.'), false; }
  else { t.qty = val('f-qty'); t.price = val('f-price'); t.fees = val('f-fees'); if (t.qty <= 0) return alert('Indiquez une quantité.'), false; }
  if (editId) S.tx = S.tx.filter(x => x.id !== editId);
  S.tx.push(t); editId = null; save();
  year = t.date.slice(0,4); render();
  return false;
}
function editTx(id){
  const t = S.tx.find(x => x.id === id); if (!t) return;
  editId = id; render();
  document.getElementById('ftitle').textContent = 'Modifier l\'opération';
  document.getElementById('f-type').value = t.type;
  document.getElementById('f-date').value = t.date;
  document.getElementById('f-company').value = t.company;
  document.getElementById('f-ticker').value = t.ticker || '';
  document.getElementById('f-qty').value = t.qty ?? '';
  document.getElementById('f-price').value = t.price ?? '';
  document.getElementById('f-fees').value = t.fees ?? 0;
  document.getElementById('f-gross').value = t.gross ?? '';
  document.getElementById('f-tax').value = t.tax ?? 0;
  toggleFields(); window.scrollTo({top:0, behavior:'smooth'});
}
function cancelEdit(){ editId = null; render(); }
function delTx(id){ if (confirm('Supprimer cette opération ?')){ S.tx = S.tx.filter(x => x.id !== id); save(); render(); } }

/* ---------- Import / export ---------- */
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportJSON(){ download('portefeuille-' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(S, null, 2), 'application/json'); }
function importJSON(inp){
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.tx)) throw 0;
      if (confirm('Remplacer les données actuelles par cette sauvegarde ?')){ S = {tx:d.tx, prices:d.prices||{}}; save(); render(); }
    } catch(e){ alert('Fichier invalide.'); }
    inp.value = '';
  };
  r.readAsText(f);
}
function exportCSV(){
  const h = ['date','type','societe','ticker','quantite','prix','frais','dividende_brut','impot'];
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const lines = [...S.tx].sort((a,b) => a.date.localeCompare(b.date)).map(t => [t.date,t.type,t.company,t.ticker,t.qty,t.price,t.fees,t.gross,t.tax].map(q).join(';'));
  download('operations.csv', '\ufeff' + h.join(';') + '\n' + lines.join('\n'), 'text/csv;charset=utf-8');
}

render();
</script>
</body>
</html>
